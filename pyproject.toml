[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-studio"
dynamic = ["version"]
description = "Record a voice-over against a silent picture, locally: flags, teleprompter, slip marking, crash-safe takes."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []  # the server is standard library only

[project.optional-dependencies]
icon = ["Pillow", "numpy"]

[project.scripts]
voice-studio = "voice_studio.__main__:main"

[tool.setuptools]
packages = ["voice_studio"]

[tool.setuptools.dynamic]
version = { attr = "voice_studio.__version__" }

[tool.setuptools.package-data]
voice_studio = ["web/*"]
